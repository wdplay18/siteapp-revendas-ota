name: Publish OTA 1.0.17 package
on:
  push:
    paths:
      - '.github/workflows/publish-package-1.0.17.yml'
permissions:
  contents: write
jobs:
  publish-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify validated package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e884-820e-b9d8-4e2f6dba931b/raw?se=2026-09-20T04%3A46%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=01a0bd1c-dc9d-7bea-bcf7-603991c14c95&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T18%3A25%3A33Z&ske=2026-09-20T18%3A25%3A33Z&sks=b&skv=2026-02-06&sig=vIp%2BcdX5F8d/7H0I%2B%2BfbaLQmEdmSHe1LZXa9tWdgkCU%3D' -o /tmp/artifact.zip
          unzip -p /tmp/artifact.zip siteapp-revendas-1.0.17.zip > packages/siteapp-revendas-1.0.17.zip
          echo "ea4c3838e6bf4be83443a9b937c3a293bf5623a7588b97acf5d08621c0573dcb  packages/siteapp-revendas-1.0.17.zip" | sha256sum -c -
          unzip -t packages/siteapp-revendas-1.0.17.zip
      - name: Publish package only
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" = "1.0.16"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/siteapp-revendas-1.0.17.zip
          git commit -m "Publica pacote OTA 1.0.17 para homologação"
          git push
