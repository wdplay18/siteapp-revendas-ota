name: Publish OTA 1.0.16
on:
  push:
    paths:
      - '.github/workflows/publish-ota-1.0.16.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated package
        run: |
          mkdir -p packages
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-7308-820e-a3d0-2e88146a5421/raw?se=2026-09-20T02%3A36%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=d9fe9d85-a69f-5d81-887f-f9f7c9ad1352&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T18%3A18%3A09Z&ske=2026-09-20T18%3A18%3A09Z&sks=b&skv=2026-02-06&sig=q0WqVk297FUCkE0llwF/aOXp8o6jALai4Zq0VfdypCI%3D' -o /tmp/artifact.zip
          unzip -p /tmp/artifact.zip siteapp-revendas-1.0.16.zip > packages/siteapp-revendas-1.0.16.zip
          echo "6939b5b68f837dcbdf076c296f5ac764b5e696f7e4e80af0ac491416a9b7c504  packages/siteapp-revendas-1.0.16.zip" | sha256sum -c -
      - name: Write signed manifest
        shell: bash
        run: |
          cat > manifest.json <<'JSON'
{
  "version": "1.0.16",
  "package_url": "https://raw.githubusercontent.com/wdplay18/siteapp-revendas-ota/main/packages/siteapp-revendas-1.0.16.zip",
  "sha256": "6939b5b68f837dcbdf076c296f5ac764b5e696f7e4e80af0ac491416a9b7c504",
  "changelog": [
    "Refina a experiência mobile de Aplicativos, Tutoriais, Planos e Jogos do Dia conforme a referência visual.",
    "Consolida a administração de WhatsApp e Planos por site, com Guia de Jogos centralizado no Master.",
    "Reforça validações, limites de campos e confirmações seguras nos módulos comerciais.",
    "Inclui a migração V8 para WhatsApp, Planos e Guia de Jogos quando o banco ainda precisar ser atualizado."
  ],
  "signature_algorithm": "RSA-SHA256",
  "key_id": "rsa-2026-09-v3",
  "signature": ""
}
JSON
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/siteapp-revendas-1.0.16.zip manifest.json
          git commit -m "Libera OTA assinada 1.0.16"
          git push
